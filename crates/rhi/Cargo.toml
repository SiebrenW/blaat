[package]
name = "engine-rhi"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["vulkan"]
# Vulkan backend. Always available; on macOS it runs through MoltenVK.
vulkan = ["dep:ash", "dep:ash-window", "dep:gpu-allocator"]

[dependencies]
raw-window-handle = "0.6"
ash = { version = "0.38", optional = true }
ash-window = { version = "0.13", optional = true }
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"], optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = "0.3"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
dispatch2 = "0.3"

[dev-dependencies]
engine-shaders = { path = "../shaders" }
engine-core = { path = "../core" }
winit = "0.30"
